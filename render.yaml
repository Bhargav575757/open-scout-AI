# Render Blueprint Specification (100% Zero-Cost Free Tier)
# Documentation: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: openscout-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
        # Set to your Vercel URL e.g. https://openscoutai.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOW_ORIGIN_REGEX
        value: "^https://.*\\.vercel\\.app$"
      - key: GITHUB_TOKEN
        sync: false
        # Set to your GitHub PAT for 5,000 requests/hour
      - key: MISTRAL_API_KEY
        sync: false
        # Set to your Mistral AI API Key
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: DATABASE_URL
        sync: false
        # Paste your Supabase connection string: postgresql://postgres.[REF]:[PASSWORD]@aws-0-[REGION].pooler.supabase.com:5432/postgres?sslmode=require
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: DEBUG
        value: "false"
